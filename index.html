<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clima Agora</title>
    <meta
      name="description"
      content="Painel de clima moderno com previsão do tempo e busca por cidade."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>

    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <p class="eyebrow">Clima e previsão</p>
          <h1>Clima Agora</h1>
        </div>

        <button id="locationButton" class="ghost-button" type="button">
          Usar minha localização
        </button>
      </header>

      <form id="searchForm" class="search-bar" autocomplete="off">
        <label class="sr-only" for="cityInput">Buscar cidade</label>
        <input
          id="cityInput"
          name="city"
          type="text"
          placeholder="Digite uma cidade..."
          value="Lisboa"
        />
        <button type="submit">Buscar</button>
      </form>

      <main class="weather-layout">
        <section class="weather-card">
          <div class="location-row">
            <div>
              <p id="cityName" class="city">Carregando...</p>
              <p id="dateText" class="date">--</p>
            </div>
            <div id="conditionTag" class="condition-tag">--</div>
          </div>

          <div class="main-weather">
            <div id="weatherIcon" class="weather-icon" aria-label="Condição do tempo">☀️</div>
            <div>
              <div id="temperature" class="temperature">--°</div>
              <div id="conditionText" class="condition">--</div>
            </div>
          </div>

          <div class="stats-grid">
            <div class="stat-box">
              <span>Sensação</span>
              <strong id="feelsLike">--°</strong>
            </div>
            <div class="stat-box">
              <span>Umidade</span>
              <strong id="humidity">--%</strong>
            </div>
            <div class="stat-box">
              <span>Vento</span>
              <strong id="wind">-- km/h</strong>
            </div>
            <div class="stat-box">
              <span>Máx / Mín</span>
              <strong id="tempRange">-- / --</strong>
            </div>
          </div>
        </section>

        <aside class="forecast-panel">
          <div class="panel-header">
            <h2>Próximos dias</h2>
            <span class="panel-badge">5 dias</span>
          </div>
          <div id="forecastList" class="forecast-list"></div>
        </aside>
      </main>
    </div>

    <template id="forecastItemTemplate">
      <div class="forecast-item">
        <span class="forecast-day"></span>
        <span class="forecast-icon" aria-hidden="true"></span>
        <span class="forecast-temp"></span>
      </div>
    </template>

    <script src="app.js"></script>
  </body>
</html>
